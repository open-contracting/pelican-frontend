name: Lint
on: [push, pull_request]
jobs:
  lint:
    uses: open-contracting/.github/.github/workflows/lint.yml@main
    permissions:
      contents: write
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      # Copy of release-schema.json to generate template tags.
      ocds-schema-exceptions: release-schema.json
      # Defer indentation to biome format.
      ocds-noindent: 'yes'
