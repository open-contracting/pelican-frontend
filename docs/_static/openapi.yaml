openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/data_items/{id}/:
    get:
      operationId: data_items_retrieve
      description: Return OCDS data that passed or failed a check.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - data_items
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataItem'
          description: ''
  /api/dataset-distinct-values/{dataset_id}/{field}/:
    get:
      operationId: dataset_distinct_values
      description: Return the field's 200 most common values, with their counts, in
        descending order.
      parameters:
      - in: path
        name: dataset_id
        schema:
          type: integer
        required: true
      - in: path
        name: field
        schema:
          type: string
        required: true
      tags:
      - dataset-distinct-values
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DistinctValue'
          description: ''
  /api/dataset-distinct-values/{dataset_id}/{field}/{query}/:
    get:
      operationId: dataset_distinct_values_search
      description: Return the field's 200 most common values containing the query,
        with their counts, in descending order.
      parameters:
      - in: path
        name: dataset_id
        schema:
          type: integer
        required: true
      - in: path
        name: field
        schema:
          type: string
        required: true
      - in: path
        name: query
        schema:
          type: string
        required: true
      tags:
      - dataset-distinct-values
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DistinctValue'
          description: ''
  /api/dataset-filter-items/:
    post:
      operationId: dataset_filter_items_create
      description: |-
        Return the number of data items that the filter matches, as an object.

        ``{"items": 123}`` for example.
      tags:
      - dataset-filter-items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountDatasetFilterItems'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: integer
          description: ''
  /api/datasets/:
    get:
      operationId: datasets_list
      description: Return all datasets with their status and filter metadata.
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
          description: ''
    post:
      operationId: datasets_create
      description: Publish a message to RabbitMQ to create a dataset.
      tags:
      - datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataset'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '202':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/datasets/{id}/:
    get:
      operationId: datasets_retrieve
      description: Return the dataset with its status and filter metadata.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
    delete:
      operationId: datasets_destroy
      description: Publish a message to RabbitMQ to wipe the dataset.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/datasets/{id}/compiled_release_level/{name}/:
    get:
      operationId: datasets_compiled_release_level_retrieve
      description: Return a report and examples of one compiled release-level check.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLevelCheckDetail'
          description: ''
  /api/datasets/{id}/compiled_release_level/{name}/failures/:
    get:
      operationId: datasets_compiled_release_level_failures_retrieve
      description: Return, one OCID per line, the compiled releases failing the compiled
        release-level check.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
  /api/datasets/{id}/compiled_release_level_report/:
    get:
      operationId: datasets_compiled_release_level_report_retrieve
      description: Return a report of the dataset's compiled release-level checks,
        by check name.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLevelReport'
          description: ''
  /api/datasets/{id}/dataset_level_report/:
    get:
      operationId: datasets_dataset_level_report_retrieve
      description: Return a report of the dataset's dataset-level checks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/datasets/{id}/field_level/{name}/:
    get:
      operationId: datasets_field_level_retrieve
      description: Return a report and examples of one field-level check.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldLevelCheckDetail'
          description: ''
  /api/datasets/{id}/field_level/{name}/failures/:
    get:
      operationId: datasets_field_level_failures_retrieve
      description: Return, one OCID per line, the compiled releases failing the field-level
        check.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: name
        schema:
          type: string
        required: true
      - in: query
        name: type
        schema:
          type: string
          enum:
          - coverage
          - quality
          default: quality
        description: The type of check
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
  /api/datasets/{id}/field_level_report/:
    get:
      operationId: datasets_field_level_report_retrieve
      description: Return a report of the dataset's field-level checks, by field path.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldLevelReport'
          description: ''
  /api/datasets/{id}/filter/:
    post:
      operationId: datasets_filter_create
      description: Publish a message to RabbitMQ to create a filtered dataset.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterDataset'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/datasets/{id}/metadata/:
    get:
      operationId: datasets_metadata_retrieve
      description: Return the dataset's collection metadata.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/datasets/{id}/status/:
    get:
      operationId: datasets_status_retrieve
      description: 'Return the dataset''s status, as an object like `{"phase": "CHECKED",
        "state": "OK"}`, or `{}` if not set.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/datasets/{id}/time_based_report/:
    get:
      operationId: datasets_time_based_report_retrieve
      description: Return a report of the dataset's time-based checks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/generate-report:
    post:
      operationId: generate_report_create
      description: |-
        Create a report in Google Docs, and return its file ID.

        The response is 200 whether or not the report was created. Its ``status`` is ``ok``, ``report_error`` if
        the report could not be created, or ``template_error`` if the template could not be rendered.
      tags:
      - generate-report
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReport'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateReportResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/settings/:
    get:
      operationId: settings_retrieve
      description: Return the settings that the frontend needs in order to generate
        a report.
      tags:
      - settings
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
components:
  schemas:
    CountDatasetFilterItems:
      type: object
      properties:
        dataset_id_original:
          type: integer
          description: The ID of the dataset to filter
        filter_message:
          allOf:
          - $ref: '#/components/schemas/FilterDataset'
          description: The filter to apply
      required:
      - dataset_id_original
      - filter_message
    CreateDataset:
      type: object
      properties:
        name:
          type: string
          description: The name to assign to the dataset
        collection_id:
          type: integer
          description: The compiled collection ID in Kingfisher Process
        ancestor_id:
          type: integer
          description: The ID of the previous report in Pelican, for time-based checks
        max_items:
          type: integer
          description: The number of compiled releases to import from Kingfisher Process
      required:
      - collection_id
      - name
    DataItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        data: {}
      required:
      - data
      - id
    Dataset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        meta: {}
        ancestor_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        created:
          type: string
          format: date-time
          nullable: true
        modified:
          type: string
          format: date-time
          nullable: true
        phase:
          type: string
        state:
          type: string
        parent_id:
          type: integer
        parent_name:
          type: string
        filter_message: {}
      required:
      - filter_message
      - id
      - name
      - parent_id
      - parent_name
      - phase
      - state
    DistinctValue:
      type: object
      properties:
        value:
          type: string
          description: The field's value
        count:
          type: integer
          description: The number of data items with this value
      required:
      - count
      - value
    ExampleMeta:
      type: object
      properties:
        ocid:
          type: string
          description: The compiled release's OCID
        item_id:
          type: integer
          description: The data item's ID
      required:
      - item_id
      - ocid
    FieldLevelCheck:
      type: object
      properties:
        coverage:
          $ref: '#/components/schemas/FieldLevelGroup'
        quality:
          $ref: '#/components/schemas/FieldLevelGroup'
        examples_filled:
          type: boolean
          description: Whether the examples are in the database
        processing_order:
          type: integer
          description: The order in which to display the field
      required:
      - coverage
      - examples_filled
      - processing_order
      - quality
    FieldLevelCheckDetail:
      type: object
      properties:
        coverage:
          $ref: '#/components/schemas/FieldLevelGroupDetail'
        quality:
          $ref: '#/components/schemas/FieldLevelGroupDetail'
        examples_filled:
          type: boolean
          description: Whether the examples are in the database
        processing_order:
          type: integer
          description: The order in which to display the field
        time:
          type: number
          format: double
          description: The number of seconds the request took
      required:
      - coverage
      - examples_filled
      - processing_order
      - quality
      - time
    FieldLevelCounts:
      type: object
      properties:
        total_count:
          type: integer
          description: The number of times the check was applied
        passed_count:
          type: integer
          description: The number of times the check passed
        failed_count:
          type: integer
          description: The number of times the check failed
        passed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
          nullable: true
        failed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
          nullable: true
      required:
      - failed_count
      - failed_examples
      - passed_count
      - passed_examples
      - total_count
    FieldLevelCountsDetail:
      type: object
      properties:
        total_count:
          type: integer
          description: The number of times the check was applied
        passed_count:
          type: integer
          description: The number of times the check passed
        failed_count:
          type: integer
          description: The number of times the check failed
        passed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
        failed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
      required:
      - failed_count
      - failed_examples
      - passed_count
      - passed_examples
      - total_count
    FieldLevelExample:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ExampleMeta'
        path:
          type: string
          description: The field's path
        result:
          $ref: '#/components/schemas/FieldLevelExampleResult'
      required:
      - meta
      - path
      - result
    FieldLevelExampleResult:
      type: object
      properties:
        name:
          type: string
          description: The check's name
        result:
          type: boolean
          description: Whether the check passed
        reason:
          type: string
          nullable: true
          description: The reason the check failed
        value:
          nullable: true
          description: The field's value, if the check failed
        version:
          type: number
          format: double
          description: The check's version
      required:
      - name
      - reason
      - result
      - value
      - version
    FieldLevelGroup:
      type: object
      properties:
        total_count:
          type: integer
          description: The number of times the check was applied
        passed_count:
          type: integer
          description: The number of times the check passed
        failed_count:
          type: integer
          description: The number of times the check failed
        passed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
          nullable: true
        failed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
          nullable: true
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldLevelCounts'
          description: The checks, by name
      required:
      - checks
      - failed_count
      - failed_examples
      - passed_count
      - passed_examples
      - total_count
    FieldLevelGroupDetail:
      type: object
      properties:
        total_count:
          type: integer
          description: The number of times the check was applied
        passed_count:
          type: integer
          description: The number of times the check passed
        failed_count:
          type: integer
          description: The number of times the check failed
        passed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
        failed_examples:
          type: array
          items:
            $ref: '#/components/schemas/FieldLevelExample'
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldLevelCountsDetail'
          description: The checks, by name
      required:
      - checks
      - failed_count
      - failed_examples
      - passed_count
      - passed_examples
      - total_count
    FieldLevelReport:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/FieldLevelCheck'
    FilterDataset:
      type: object
      properties:
        release_date_from:
          type: string
          description: The minimum release date (YYYY-MM-DD)
        release_date_to:
          type: string
          description: The maximum release date (YYYY-MM-DD)
        buyer:
          type: array
          items:
            type: string
          description: Names of buyers
        buyer_regex:
          type: string
          description: A SQL ILIKE pattern for the buyer's name
        procuring_entity:
          type: array
          items:
            type: string
          description: Names of procuring entities
        procuring_entity_regex:
          type: string
          description: A SQL ILIKE pattern for the procuring entity's name
    GenerateReport:
      type: object
      properties:
        dataset_id:
          type: integer
          description: The dataset's ID
        document_id:
          type: string
          description: The ID of the Google Docs template
        folder_id:
          type: string
          description: The ID of the Google Drive folder in which to create the report
        language:
          type: string
          description: The report's language, defaulting to English
        report_name:
          type: string
          description: The report's filename, defaulting to a generated name
      required:
      - dataset_id
      - document_id
      - folder_id
    GenerateReportResponse:
      oneOf:
      - $ref: '#/components/schemas/GeneratedReport'
      - $ref: '#/components/schemas/ReportError'
      - $ref: '#/components/schemas/TemplateError'
    GeneratedReport:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/GeneratedReportStatusEnum'
        data:
          $ref: '#/components/schemas/ReportFile'
        failed_tags:
          type: array
          items:
            type: string
          description: The tags that could not be rendered
      required:
      - data
      - failed_tags
      - status
    GeneratedReportStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    PhaseEnum:
      enum:
      - CONTRACTING_PROCESS
      - DATASET
      - TIME_VARIANCE
      - CHECKED
      - DELETED
      type: string
      description: |-
        * `CONTRACTING_PROCESS` - Contracting Process
        * `DATASET` - Dataset
        * `TIME_VARIANCE` - Time Variance
        * `CHECKED` - Checked
        * `DELETED` - Deleted
    ReportError:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReportErrorStatusEnum'
        data:
          $ref: '#/components/schemas/ReportReason'
      required:
      - data
      - status
    ReportErrorStatusEnum:
      enum:
      - report_error
      type: string
      description: '* `report_error` - report_error'
    ReportFile:
      type: object
      properties:
        file_id:
          type: string
          description: The ID of the Google Docs report
      required:
      - file_id
    ReportReason:
      type: object
      properties:
        reason:
          type: string
          description: The reason the report could not be created
      required:
      - reason
    ResourceLevelCheck:
      type: object
      properties:
        name:
          type: string
          description: The check's name
        total_count:
          type: integer
          description: The number of compiled releases the check was applied to
        passed_count:
          type: integer
          description: The number of compiled releases that passed
        failed_count:
          type: integer
          description: The number of compiled releases that failed
        undefined_count:
          type: integer
          description: The number of compiled releases the check did not apply to
        individual_application_count:
          type: integer
          description: The number of times the check was applied
        individual_passed_count:
          type: integer
          description: The number of times the check passed
        individual_failed_count:
          type: integer
          description: The number of times the check failed
        examples_filled:
          type: boolean
          description: Whether the examples are in the database
        passed_examples:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLevelExample'
        failed_examples:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLevelExample'
        undefined_examples:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLevelExample'
      required:
      - examples_filled
      - failed_count
      - failed_examples
      - individual_application_count
      - individual_failed_count
      - individual_passed_count
      - name
      - passed_count
      - passed_examples
      - total_count
      - undefined_count
      - undefined_examples
    ResourceLevelCheckDetail:
      type: object
      properties:
        name:
          type: string
          description: The check's name
        total_count:
          type: integer
          description: The number of compiled releases the check was applied to
        passed_count:
          type: integer
          description: The number of compiled releases that passed
        failed_count:
          type: integer
          description: The number of compiled releases that failed
        undefined_count:
          type: integer
          description: The number of compiled releases the check did not apply to
        individual_application_count:
          type: integer
          description: The number of times the check was applied
        individual_passed_count:
          type: integer
          description: The number of times the check passed
        individual_failed_count:
          type: integer
          description: The number of times the check failed
        examples_filled:
          type: boolean
          description: Whether the examples are in the database
        passed_examples:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLevelExample'
        failed_examples:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLevelExample'
        undefined_examples:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLevelExample'
        time:
          type: number
          format: double
          description: The number of seconds the request took
      required:
      - examples_filled
      - failed_count
      - failed_examples
      - individual_application_count
      - individual_failed_count
      - individual_passed_count
      - name
      - passed_count
      - passed_examples
      - time
      - total_count
      - undefined_count
      - undefined_examples
    ResourceLevelExample:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ExampleMeta'
        result:
          $ref: '#/components/schemas/ResourceLevelExampleResult'
      required:
      - meta
      - result
    ResourceLevelExampleResult:
      type: object
      properties:
        result:
          type: boolean
          nullable: true
          description: Whether the check passed
        meta:
          nullable: true
          description: Any additional data to help interpret the result
        pass_count:
          type: integer
          nullable: true
          description: The number of times the check passed
        application_count:
          type: integer
          nullable: true
          description: The number of times the check was applied
        version:
          type: number
          format: double
          description: The check's version
      required:
      - application_count
      - meta
      - pass_count
      - result
      - version
    ResourceLevelReport:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ResourceLevelCheck'
    Settings:
      type: object
      properties:
        user:
          type: string
          description: The service account that the template and folder must be shared
            with
        template:
          type: object
          additionalProperties:
            type: string
          description: The ID of the default Google Docs template, by language
        folder:
          type: string
          description: The ID of the default Google Drive folder in which to create
            reports
      required:
      - folder
      - template
      - user
    StateEnum:
      enum:
      - IN_PROGRESS
      - OK
      type: string
      description: |-
        * `IN_PROGRESS` - In Progress
        * `OK` - Ok
    Status:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/StateEnum'
        phase:
          $ref: '#/components/schemas/PhaseEnum'
      required:
      - phase
      - state
    TagError:
      type: object
      properties:
        reason:
          type: string
          description: The reason the tag could not be rendered
        full_tag:
          type: string
          nullable: true
          description: The tag as extracted from the template
        template_id:
          type: string
          nullable: true
          description: The ID of the Google Docs template
      required:
      - full_tag
      - reason
      - template_id
    TemplateError:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TemplateErrorStatusEnum'
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagError'
        failed_tags:
          type: array
          items:
            type: string
          description: The tags that could not be rendered
      required:
      - data
      - failed_tags
      - status
    TemplateErrorStatusEnum:
      enum:
      - template_error
      type: string
      description: '* `template_error` - template_error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
